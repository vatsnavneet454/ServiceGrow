
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ServiceGrow</title>
</head>
<body style="background:#080b12;color:white;font-family:Arial;padding:50px;">
    <h1 style="color:#ff963d;">ServiceGrow Admin Dashboard</h1>
    <p>Welcome, Admin! Your login is working successfully.</p>
    <button onclick="logout()">Logout</button>

    <script>
        const token = sessionStorage.getItem("servicegrow_token");
        const user = JSON.parse(sessionStorage.getItem("servicegrow_user") || "null");

        if (!token || !user || user.role !== "admin") {
            window.location.href = "login.html";
        }

        function logout() {
            sessionStorage.removeItem("servicegrow_token");
            sessionStorage.removeItem("servicegrow_user");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
